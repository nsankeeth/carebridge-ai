services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medhandoff
      POSTGRES_PASSWORD: medhandoff
      POSTGRES_DB: medhandoff
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medhandoff"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
